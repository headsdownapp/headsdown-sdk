query VerdictSettings {
    verdictSettings {
      id
      thresholds {
        online {
          maxFiles
          maxEstimatedMinutes
        }
        busy {
          maxFiles
          maxEstimatedMinutes
        }
        limited {
          maxFiles
          maxEstimatedMinutes
        }
        offline {
          maxFiles
          maxEstimatedMinutes
        }
      }
      defaultWrapUpMode
      wrapUpThresholdMinutes
      insertedAt
      updatedAt
    }
  }

mutation UpdateVerdictSettings($thresholds: VerdictModeThresholdsInput, $defaultWrapUpMode: WrapUpMode, $wrapUpThresholdMinutes: Int) {
    updateVerdictSettings(thresholds: $thresholds, defaultWrapUpMode: $defaultWrapUpMode, wrapUpThresholdMinutes: $wrapUpThresholdMinutes) {
      id
      thresholds {
        online {
          maxFiles
          maxEstimatedMinutes
        }
        busy {
          maxFiles
          maxEstimatedMinutes
        }
        limited {
          maxFiles
          maxEstimatedMinutes
        }
        offline {
          maxFiles
          maxEstimatedMinutes
        }
      }
      defaultWrapUpMode
      wrapUpThresholdMinutes
      insertedAt
      updatedAt
    }
  }

query DigestSummaries($latest: Int) {
    digestSummaries(latest: $latest) {
      id
      actorRef
      actorLabel
      sourceType
      action
      channelRef
      events {
        description
        insertedAt
      }
      entryCount
      firstEventAt
      lastEventAt
    }
  }

mutation DismissDigestEntry($id: ID!) {
