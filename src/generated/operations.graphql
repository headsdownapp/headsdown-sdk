query Teams($id: ID) {
    teams(id: $id) {
      id
      name
      icon
      description
      members {
        id
        email
        name
        location
        avatar
      }
    }
  }

query Company {
    company {
      id
      name
      teams {
        id
        name
        icon
        description
      }
    }
  }

query TeamPresence($teamId: ID!) {
    teamPresence(teamId: $teamId) {
