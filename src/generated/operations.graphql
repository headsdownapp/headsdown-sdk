query ActiveContract {
    activeContract {
      id
      mode
      status
      statusEmoji
      statusText
      autoRespond
      lock
      duration
      ruleSetType
      ruleSetParams
      expiresAt
      insertedAt
    }
  }

query Schedule($at: DateTime) {
    schedule: availability(at: $at) {
      inReachableHours
      nextTransitionAt
      attentionDeadlineAt
      wrapUpGuidance {
        active
        deadlineAt
        remainingMinutes
        profile
        source
        reason
        hints
        thresholdMinutes
        selectedMode
      }
      activeWindow {
        id
        label
        priority
        startTime
        endTime
        days
        mode
        alertsPolicy
        snooze
        status
        statusEmoji
        statusText
        autoActivate
      }
      nextWindow {
        id
        label
        priority
        startTime
        endTime
        days
        mode
        alertsPolicy
        snooze
        status
        statusEmoji
        statusText
        autoActivate
      }
    }
  }

query AgentControlOverview {
    agentControlOverview {
      currentCall {
        callKey
        title
        body
        primaryActionLabel
        primaryActionIntent
        secondaryActionLabel
        secondaryActionIntent
        recommendedActionKey
        allowedActionKeys
        reasonCodes
        dataState
        evaluatedAt
      }
      headsdownCall {
        key
        knownKey
        title
        body
        severity
        urgency
        primaryActionLabel
        primaryActionKey
        primaryActionKnownKey
        primaryActionIntent
        secondaryActionLabel
        secondaryActionKey
        secondaryActionKnownKey
        secondaryActionIntent
        recommendedActionKey
        recommendedActionKnownKey
        allowedActionKeys
        allowedActionKnownKeys
        allowedUiIntents
        reasonCodes
        confidence
        evidenceSource
        privacyMode
        expiresAt
      }
      needsYourYes {
        runId
        proposalId
        actionTargetId
        callKey
        title
        body
        itemState
        primaryActionLabel
        primaryActionIntent
        recommendedActionKey
        allowedActionKeys
        reasonCodes
        dataState
        createdAt
        updatedAt
      }
      needsYourYesState
      runSummaries {
        runId
        proposalId
        actionTargetId
        callKey
        runState
        actionState
        clientLabel
        safeTitle
        recommendedActionKey
        allowedActionKeys
        reasonCodes
        elapsedSeconds
        deadlineState
        budgetState
        nextActionLabel
        nextActionIntent
        dataState
        detailsState
        progressState
        insertedAt
        updatedAt
      }
      runSummariesState
      valueMetrics {
        metricKey
        label
        value
        unit
        confidence
        evidenceCount
        explanation
        dataState
      }
      valueMetricsState
      generatedAt
    }
  }

query InterventionReplay($proposalId: ID!) {
    interventionReplay(proposalId: $proposalId) {
      runId
      proposalId
      actionTargetId
      callKey
      title
      whatWasAboutToHappen
      whatHeadsdownSaw {
        key
        label
        value
      }
      headsdownCall
      thePlay
      result
      nextTime
      reasonCodes
      recommendedActionKey
      valueEvidence
      dataState
      updatedAt
    }
  }

